# herdr 配置 —— 全量键位显式写出（默认值 + 本仓库改动都在这里）
# 习惯沿用 archibate/tmux-conf：Ctrl+z 前缀、hjkl 焦点、s/v 分屏、c/n/p 切 tab
onboarding = false

# ============================================================ 全局
[keys]
# 前缀键（herdr 默认 Ctrl+b）
prefix = "ctrl+z"

# 键位帮助面板，里面 / 可过滤（默认 prefix+?）
help = "prefix+?"

# 设置面板（herdr 默认 prefix+s，被水平分屏占用，挪到 Shift+s）
settings = "prefix+shift+s"

# detach：客户端退出，服务器和所有面板继续跑（默认 prefix+q）
detach = "prefix+q"

# 重新加载本文件（默认 prefix+shift+r）
reload_config = "prefix+shift+r"

# 跳到发通知的那个面板（默认 prefix+o）
open_notification_target = "prefix+o"

# 粘贴剪贴板图片（只在 herdr --remote 时生效；默认 ctrl+v）
remote_image_paste = "ctrl+v"

# ============================================================ 工作区
# 工作区导航模式（默认 prefix+w）
workspace_picker = "prefix+w"

# 会话导航器 / goto picker（默认 prefix+g）
goto = "prefix+g"

# 新建工作区（默认 prefix+shift+n）
new_workspace = "prefix+shift+n"

# 新建 git worktree（默认 prefix+shift+g）
new_worktree = "prefix+shift+g"

# 打开已有 worktree 的 checkout（默认未绑定）
open_worktree = "prefix+alt+w"

# 删除 worktree（会弹确认；默认未绑定）
remove_worktree = "prefix+alt+shift+w"

# 重命名工作区（herdr 默认 prefix+shift+w，改成 tmux 的 `.`）
rename_workspace = "prefix+period"

# 关闭工作区，二次确认（默认 prefix+shift+d）
close_workspace = "prefix+shift+d"

# 上一个 / 下一个工作区（默认未绑定）
previous_workspace = "prefix+alt+h"
next_workspace = "prefix+alt+l"

# 工作区 1..9 直切（默认未绑定）
switch_workspace = "prefix+alt+1..9"

# 上一个 / 下一个 agent（默认未绑定）
previous_agent = "prefix+alt+k"
next_agent = "prefix+alt+j"

# agent 1..9 直跳（默认未绑定）
focus_agent = "prefix+shift+alt+1..9"

# ============================================================ 标签页
# 新建（默认 prefix+c）
new_tab = "prefix+c"

# 重命名（默认 prefix+shift+t）
rename_tab = "prefix+shift+t"

# 下一个 / 上一个（默认 prefix+n / prefix+p）
next_tab = "prefix+n"
previous_tab = "prefix+p"

# 把当前 tab 往前 / 往后挪（默认未绑定，tmux 的 M-n / M-p）
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# 切到第 N 个 tab：免前缀，直接 Alt+数字（默认 prefix+1..9）
switch_tab = "alt+1..9"

# 关闭 tab（herdr 默认 prefix+shift+x）
close_tab = "prefix+X"

# ============================================================ 面板
# 重命名面板（默认 prefix+shift+p）
rename_pane = "prefix+shift+p"

# 回滚编辑：在编辑器里翻看 / 搜索当前面板历史输出（默认 prefix+e）
edit_scrollback = "prefix+e"

# 清屏（默认未绑定）
clear_pane = "prefix+alt+x"

# 焦点移动 hjkl（默认 prefix+h/j/k/l）
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# 循环切换面板（默认 prefix+tab / prefix+shift+tab）
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# 回到上一个面板（默认未绑定，tmux 的 ;）
last_pane = "prefix+semicolon"

# 分屏：v 竖切（左右），s 横切（上下，herdr 默认 prefix+minus）
split_vertical = "prefix+v"
split_horizontal = "prefix+s"

# 关闭面板（默认 prefix+x）
close_pane = "prefix+x"

# 缩放 / 全屏（默认 prefix+z）
zoom = "prefix+z"

# resize 模式：进去后 hjkl / 方向键调大小，Esc 或 Enter 退出（默认 prefix+r）
resize_mode = "prefix+r"

# 不进 resize 模式直接调大小（默认未绑定）
resize_pane_left = "prefix+alt+shift+h"
resize_pane_down = "prefix+alt+shift+j"
resize_pane_up = "prefix+alt+shift+k"
resize_pane_right = "prefix+alt+shift+l"

# 折叠 / 展开侧边栏（默认 prefix+b）
toggle_sidebar = "prefix+b"

# ============================================================ 导航模式内部键
# prefix+w 打开的导航模式里，这些本地键优先于 focus_pane_*
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# ============================================================ 自定义命令
# 无缝导航：Alt+方向键 在 nvim 分屏和 herdr 面板之间穿越（走到边缘环绕）
[[keys.command]]
key = "alt+left"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+right"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# 保存当前面板输出到 ~/herdr-captures/（tmux 的 C-w capture-pane）
[[keys.command]]
key = "prefix+ctrl+w"
type = "shell"
command = "$HOME/.config/herdr/scripts/capture-pane.sh"
description = "save pane output to a file"

# ============================================================ 主题
[theme]
name = "dracula"
auto_switch = false
