# herdr 配置 —— 键位习惯沿用 archibate/tmux-conf（Ctrl+z 前缀、hjkl 焦点、s/v 分屏）
onboarding = false

[keys]
# 前缀键：Ctrl+z（herdr 默认 Ctrl+b）
prefix = "ctrl+z"

# 设置面板：herdr 默认 prefix+s，被下面的水平分屏占用了，挪到 prefix+Shift+s
settings = "prefix+shift+s"

# 分屏：s 横切一刀（上下），v 竖切一刀（左右）；新面板继承当前目录
split_horizontal = "prefix+s"
split_vertical = "prefix+v"

# 面板焦点：hjkl（与 herdr 默认一致，显式写出）
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# 缩放当前面板成全屏（与 herdr 默认一致）
zoom = "prefix+z"

# 标签页：c 新建、n/p 切换（与 herdr 默认一致，显式写出）
# 跳转免前缀，直接 Alt+1..9；重命名用 herdr 默认的 prefix+Shift+t
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "alt+1..9"

# 回到上一个面板（herdr 默认未绑定）
last_pane = "prefix+semicolon"

# 回滚编辑：在编辑器里翻看/搜索当前面板的历史输出（与 herdr 默认一致）
edit_scrollback = "prefix+e"

# 关闭：x 关面板，X 关标签页（herdr 默认关标签页是 prefix+Shift+x）
close_pane = "prefix+x"
close_tab = "prefix+X"

# 重命名工作区：`.` 键（herdr 默认 prefix+Shift+w）
rename_workspace = "prefix+period"


# 无缝导航：Alt+方向键 在 nvim 分屏和 herdr 面板之间穿越
[[keys.command]]
key = "alt+left"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "alt+down"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "alt+up"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "alt+right"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[theme]
name = "dracula"
auto_switch = false
